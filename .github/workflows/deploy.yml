name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:staging
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations (staging)
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Staging health check
        id: staging-health
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: |
          if [ -z "$STAGING_URL" ]; then
            echo "STAGING_URL not set, skipping health check"
            exit 0
          fi
          for i in 1 2 3 4 5; do
            STATUS=$(curl -sf "$STAGING_URL/api/health" | jq -r '.status' 2>/dev/null)
            if [ "$STATUS" = "healthy" ] || [ "$STATUS" = "degraded" ]; then
              echo "Staging health check passed: $STATUS"
              exit 0
            fi
            echo "Attempt $i: waiting for healthy status..."
            sleep 10
          done
          echo "Staging health check failed after 5 attempts"
          exit 1
        timeout-minutes: 2

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image for production
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository }}:latest \
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations (production)
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Production health check
        id: health-check
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "PRODUCTION_URL not set, skipping health check"
            exit 0
          fi
          for i in 1 2 3 4 5; do
            STATUS=$(curl -sf "$PRODUCTION_URL/api/health" | jq -r '.status' 2>/dev/null)
            if [ "$STATUS" = "healthy" ] || [ "$STATUS" = "degraded" ]; then
              echo "Health check passed: $STATUS"
              exit 0
            fi
            echo "Attempt $i: waiting for healthy status..."
            sleep 10
          done
          echo "Health check failed after 5 attempts"
          exit 1
        timeout-minutes: 2

      - name: Rollback on failure
        if: failure() && steps.health-check.outcome == 'failure'
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          echo "::error::Production health check failed - initiating rollback"
          echo "Rolling back to previous image: ghcr.io/${{ github.repository }}:${PREVIOUS_SHA}"

          # Re-tag the previous good image as latest
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository }}:latest \
            ghcr.io/${{ github.repository }}:${PREVIOUS_SHA} 2>/dev/null || \
            echo "::warning::Could not rollback image tag - manual intervention required"

          echo "::warning::Rollback initiated. Verify production health manually."
